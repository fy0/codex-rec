name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: codex-rec-x86_64-unknown-linux-musl
          - target: x86_64-unknown-linux-gnu
            artifact: codex-rec-x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install C toolchain for aws-lc-rs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake nasm musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          set -o pipefail
          cargo build --release --target ${{ matrix.target }} 2>&1 | tee build-${{ matrix.target }}.log

      - name: Inspect binary
        if: always()
        run: |
          BIN=target/${{ matrix.target }}/release/codex-rec
          ls -la "$BIN" || true
          file "$BIN" || true
          ldd "$BIN" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.target }}
          path: build-${{ matrix.target }}.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/codex-rec
          if-no-files-found: error

  status:
    name: publish build status (no token needed)
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: assets

      - name: Compose status file
        run: |
          set -eu
          {
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "date=$(date -u +%FT%TZ)"
            echo "build_result=${{ needs.build.result }}"
            for d in assets/*/; do
              [ -d "$d" ] || continue
              n=$(basename "$d")
              if [ -f "$d/codex-rec" ]; then
                echo "artifact $n: size=$(stat -c%s "$d/codex-rec") sha256=$(sha256sum "$d/codex-rec" | cut -d" " -f1)"
              fi
              if [ -f "$d/build-x86_64-unknown-linux-musl.log" ]; then
                echo "--- tail build-x86_64-unknown-linux-musl.log ---"
                tail -n 40 "$d/build-x86_64-unknown-linux-musl.log"
              fi
              if [ -f "$d/build-x86_64-unknown-linux-gnu.log" ]; then
                echo "--- tail build-x86_64-unknown-linux-gnu.log ---"
                tail -n 40 "$d/build-x86_64-unknown-linux-gnu.log"
              fi
            done
          } > ci-status.txt
          cat ci-status.txt

      - name: Push status to the ci-status branch
        run: |
          set -eu
          rm -rf .git
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ci-status
          git add -f ci-status.txt
          git commit -q -m "ci status ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin ci-status

  release:
    name: attach binaries to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Flatten artifacts
        run: |
          set -eu
          mkdir -p dist
          for d in assets/*/; do
            n=$(basename "$d")
            if [ -f "$d/codex-rec" ]; then
              cp "$d/codex-rec" "dist/$n"
              chmod +x "dist/$n"
            fi
          done
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # aws-lc-sys ships pre-generated nasm objects; avoids requiring nasm for every target.
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: codex-rec-x86_64-unknown-linux-musl
            features: native-tls-backend,rustls-backend
          # arm64: build natively on the ARM runner instead of cross-compiling. Cross OpenSSL
          # builds need libc6-dev-arm64-cross, which --no-install-recommends skips; building on
          # ubuntu-24.04-arm sidesteps the whole toolchain problem.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: codex-rec-aarch64-unknown-linux-gnu
            features: native-tls-backend,rustls-backend
          # aarch64-musl (one static file, no glibc floor). On the ARM runner Debian's musl-tools
          # is a real aarch64 musl-gcc, so this is a genuine musl-static binary. Kept best-effort:
          # it must never block the release, and glibc-*.txt records what actually came out.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: codex-rec-aarch64-unknown-linux-musl
            features: native-tls-backend,rustls-backend
            experimental: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: codex-rec-x86_64-pc-windows-msvc
            features: native-tls-backend
    steps:
      - uses: actions/checkout@v4

      - name: Install C toolchain for vendored OpenSSL / aws-lc-rs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake nasm musl-tools ${{ matrix.apt }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}

      - name: Build (release)
        shell: bash
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          # Point cargo/cc at the right compiler per target. On the ARM runners the native
          # `cc`/`musl-gcc` are already aarch64, so no cross prefix is needed.
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              export CC_x86_64_unknown_linux_musl=musl-gcc ;;
            aarch64-unknown-linux-musl)
              export CC_aarch64_unknown_linux_musl=musl-gcc
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc ;;
          esac
          set +e
          cargo build --release --target ${{ matrix.target }} \
            --no-default-features --features ${{ matrix.features }} \
            2>&1 | tee build-${{ matrix.target }}.log
          code=${PIPESTATUS[0]}
          echo "cargo_exit_code=$code" | tee -a build-${{ matrix.target }}.log
          exit $code

      - name: Test (persona + config unit tests)
        shell: bash
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          set +e
          cargo test --release --target ${{ matrix.target }} \
            --no-default-features --features ${{ matrix.features }} 2>&1 | tail -30

      - name: Inspect binary (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN=target/${{ matrix.target }}/release/codex-rec
          ls -la "$BIN" || true
          file "$BIN" || true
          ldd "$BIN" || true
          if [ -f "$BIN" ]; then
            # An aarch64-musl binary that still needs a dynamic loader is not really musl-static;
            # record what it is so the release notes can be honest about it.
            if readelf -l "$BIN" 2>/dev/null | grep -q INTERP; then
              echo "dynamic_interpreter=yes"
            else
              echo "dynamic_interpreter=no"
            fi
          fi
          if [ -f "$BIN" ]; then
            MAX=$(grep -ao 'GLIBC_2\.[0-9]*' "$BIN" | sort -Vu | tail -1)
            echo "max_glibc=${MAX:-none}" | tee glibc-${{ matrix.target }}.txt
          else
            echo "max_glibc=missing" > glibc-${{ matrix.target }}.txt
          fi

      - name: Inspect binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/codex-rec.exe
          ls -la "$BIN" || true
          echo "max_glibc=n/a (windows)" > glibc-${{ matrix.target }}.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.target }}
          path: |
            build-${{ matrix.target }}.log
            test-${{ matrix.target }}.log
            glibc-${{ matrix.target }}.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success() || matrix.experimental
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/codex-rec
            target/${{ matrix.target }}/release/codex-rec.exe
          if-no-files-found: error

  status:
    name: publish build status (no token needed)
    needs: [build, release]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: assets

      - name: Fetch the failed job logs (so the status file explains the failure)
        if: needs.build.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run view ${{ github.run_id }} --repo ${{ github.repository }} --log-failed > failed.log 2>&1
          echo "gh exit: $?" >> failed.log
          echo "fetched $(wc -l < failed.log) lines of failed-job output"

      - name: Compose status file
        run: |
          set -eu
          {
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "date=$(date -u +%FT%TZ)"
            echo "build_result=${{ needs.build.result }}"
            echo "release_result=${{ needs.release.result }}"
            if [ -f failed.log ]; then
              echo "--- gh run view --log-failed ---"
              tail -n 150 failed.log
            fi
            for d in assets/*/; do
              [ -d "$d" ] || continue
              n=$(basename "$d")
              for f in "$d"/codex-rec*; do
                if [ -f "$f" ]; then
                  echo "artifact $n: size=$(stat -c%s "$f") sha256=$(sha256sum "$f" | cut -d' ' -f1)"
                fi
              done
              for g in "$d"/glibc-*.txt; do
                if [ -f "$g" ]; then echo "artifact $n: $(cat "$g")"; fi
              done
              for l in "$d"/build-*.log "$d"/test-*.log; do
                if [ -f "$l" ]; then
                  echo "--- tail $(basename "$l") ---"
                  tail -n 200 "$l"
                fi
              done
            done
          } > ci-status.txt
          cat ci-status.txt

      - name: Push status to the ci-status branch
        run: |
          set -eu
          rm -rf .git
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ci-status
          git add -f ci-status.txt
          git commit -q -m "ci status ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin ci-status

  release:
    name: attach binaries to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Flatten artifacts
        run: |
          set -eu
          mkdir -p dist
          for d in assets/*/; do
            n=$(basename "$d")
            for f in "$d"/codex-rec*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              cp "$f" "dist/$n${base#codex-rec}"
              chmod +x "dist/$n${base#codex-rec}"
            done
          done
          # Windows ships as a zip in the release (the bare .exe stays available as an Actions
          # artifact for debugging).
          if [ -f dist/codex-rec-x86_64-pc-windows-msvc.exe ]; then
            (cd dist && zip -q codex-rec-x86_64-pc-windows-msvc.zip codex-rec-x86_64-pc-windows-msvc.exe \
              && rm codex-rec-x86_64-pc-windows-msvc.exe)
          fi
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
